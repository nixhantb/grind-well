<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No backend, no API calls, everything served from this origin — so
         this can be strict. `style-src` needs 'unsafe-inline' because
         CodeMirror (the code editor) applies its theme/highlighting by
         injecting <style> tags at runtime; script-src does not, since
         this app has no inline scripts of its own. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';"
    />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="theme-color" content="#0b0b10" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GrindWell</title>
  </head>
  <body>
    <!-- Vue mounts INTO #app but never clears attributes on #app itself —
         only its children get replaced once main.ts's initial IndexedDB
         read resolves (usually a few ms). So only `background` (harmless
         to leave behind; the real app's own .shell covers it completely)
         lives on #app itself; the actual placeholder — and every
         layout-affecting style — is on a child that gets removed with the
         rest of #app's content the moment Vue mounts. -->
    <div id="app" style="background: #0b0b10;">
      <div style="position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #6b6b7d; font: 14px system-ui, sans-serif;">
        Loading…
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
