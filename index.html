<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No backend, no API calls, everything served from this origin — so
         this can be strict. `style-src` needs 'unsafe-inline' because
         CodeMirror (the code editor) applies its theme/highlighting by
         injecting <style> tags at runtime; script-src does not, since
         this app has no inline scripts of its own. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';"
    />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="theme-color" content="#0b0b10" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GrindWell</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
